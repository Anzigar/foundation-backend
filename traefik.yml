entryPoints:
  web:
    address: ":80"

  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

api:
  dashboard: true
  debug: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@pathwaysfoundationforthepoor.org
      storage: acme.json
      tlsChallenge: {}

http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

log:
  level: INFO

accessLog: {}
