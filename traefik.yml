# Traefik Configuration File
api:
  dashboard: true
  debug: true

entryPoints:
  web:
    address: ":80"
    # Redirect all HTTP traffic to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

certificatesResolvers:
  letsencrypt:
    acme:
      tlsChallenge: {}
      email: admin@pathwaysfoundationforthepoor.org
      storage: acme.json
      # Use Let's Encrypt staging server for testing (remove for production)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

# Global configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Logs
log:
  level: INFO

accessLog: {}

# Metrics (optional)
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
