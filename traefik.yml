entryPoints:
  web:
    address: ":80"

  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

api:
  dashboard: true
  debug: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: jastinlasway10@gmail.com
      storage: acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory # Switch to production for real certs
      tlsChallenge: {}
      # httpChallenge is commented out because TLS challenge is preferred for containerized apps
      # httpChallenge:
      #   entryPoint: web

http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

log:
  level: INFO

accessLog: {}
