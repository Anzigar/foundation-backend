entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: :443

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

api:
  dashboard: true
  debug: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: jastinlasway10@gmail.com
      storage: acme.json
      httpChallenge:
        entryPoint: web

# Global redirect to HTTPS
http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

log:
  level: INFO

accessLog: {}
